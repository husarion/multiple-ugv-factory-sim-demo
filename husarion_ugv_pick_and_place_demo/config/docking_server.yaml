/**:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 10.0
    dock_approach_timeout: 20.0
    undock_linear_tolerance: 0.19
    undock_angular_tolerance: 0.08
    max_retries: 3
    base_frame: <robot_namespace>/wibotic_receiver_link # Distance to the dock is calculated from this frame
    fixed_frame: <robot_namespace>/odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.15


    dock_plugins: ["charging_dock"]
    charging_dock:
      plugin: husarion_ugv_docking::ChargingDock
      external_detection_timeout: 0.2
      docking_distance_threshold: 0.04
      docking_yaw_threshold: 0.2
      staging_x_offset: -0.8
      filter_coef: 0.1
      use_wibotic_info: False
      wibotic_info_timeout: 1.0

    docks: ["main", "panther_toy", "lynx_main"]
    main:
      type: charging_dock
      frame: <robot_namespace>/map
      dock_frame: main_wibotic_transmitter_link
      pose: [0.1, -0.5, 0.0] # [x, y, yaw] of the dock on the map.
      gazebo_spawn_pose: [-6.65, 9.25, 1.57] # [x, y, yaw] of the dock on the gazebo world.
      apriltag_id: 0

    panther_toy:
      type: charging_dock
      frame: <robot_namespace>/map
      dock_frame: panther_toy_wibotic_transmitter_link
      pose: [-3.6, 9.849997456664482, 3.14] # [x, y, yaw] of the dock on the map.
      gazebo_spawn_pose: [-2.2, -1.0, -1.57] # [x, y, yaw] of the dock on the gazebo world.
      apriltag_id: 2

    lynx_main:
      type: charging_dock
      frame: <robot_namespace>/map
      dock_frame: lynx_main_wibotic_transmitter_link
      pose: [0.1, 2.5, 0.0] # [x, y, yaw] of the dock on the map.
      gazebo_spawn_pose: [-6.65, 6.25, 1.57] # [x, y, yaw] of the dock on the gazebo world.
      apriltag_id: 10

    controller:
      k_phi: 1.0
      k_delta: 2.0
      v_linear_min: 0.0
      v_linear_max: 0.3
      v_angular_max: 0.15
